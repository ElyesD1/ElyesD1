<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elyes Darouich — AI Engineer. Agents, RAG and LLM systems. Private by design.">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect x="12.5" y="12.5" width="1175" height="275" stroke="#30363d" stroke-width="1"/>

  <!-- corner ticks -->
  <path d="M12.5 32.5v-20h20" stroke="#8b5cf6" stroke-width="2.5"/>
  <path d="M1167.5 12.5h20v20" stroke="#8b5cf6" stroke-width="2.5"/>
  <path d="M1187.5 267.5v20h-20" stroke="#8b5cf6" stroke-width="2.5"/>
  <path d="M32.5 287.5h-20v-20" stroke="#8b5cf6" stroke-width="2.5"/>

  <!-- header row -->
  <text x="48" y="56" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace" font-size="13" letter-spacing="3" fill="#8b949e">DOSSIER — ENGINEERING PROFILE</text>
  <text x="1152" y="56" text-anchor="end" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace" font-size="13" letter-spacing="3" fill="#8b949e">TUNIS, TN · REF EN·2026</text>
  <line x1="48" y1="74" x2="1152" y2="74" stroke="#21262d" stroke-width="1"/>

  <!-- name -->
  <text x="48" y="152" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace" font-size="58" font-weight="700" letter-spacing="2" fill="#e6edf3">ELYES DAROUICH</text>
  <rect x="48" y="176" width="270" height="4" fill="url(#accent)"/>

  <!-- role -->
  <text x="48" y="216" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace" font-size="19" letter-spacing="4" fill="#22d3ee">AI ENGINEER — AGENTS · RAG · LLM SYSTEMS</text>

  <!-- stamps -->
  <g transform="rotate(-5 975 130)">
    <rect x="850" y="108" width="250" height="44" rx="4" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.9"/>
    <rect x="854" y="112" width="242" height="36" rx="2" stroke="#22c55e" stroke-width="0.5" fill="none" opacity="0.45"/>
    <text x="975" y="135" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#22c55e" opacity="0.95">OPEN FOR PROJECTS</text>
  </g>
  <g transform="rotate(3 985 200)">
    <rect x="862" y="178" width="246" height="44" rx="4" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.9"/>
    <rect x="866" y="182" width="238" height="36" rx="2" stroke="#8b5cf6" stroke-width="0.5" fill="none" opacity="0.45"/>
    <text x="985" y="205" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#8b5cf6" opacity="0.95">PRIVATE BY DESIGN</text>
  </g>

  <!-- footer row -->
  <line x1="48" y1="244" x2="1152" y2="244" stroke="#21262d" stroke-width="1"/>
  <text x="48" y="270" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace" font-size="12" letter-spacing="3" fill="#8b949e">MULTI-AGENT ORCHESTRATION · RAG PIPELINES · ON-PREMISE LLM DEPLOYMENT</text>
  <text x="1152" y="270" text-anchor="end" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace" font-size="12" letter-spacing="3" fill="#484f58">§ SYSTEMS · CREDENTIALS · TELEMETRY</text>
</svg>
